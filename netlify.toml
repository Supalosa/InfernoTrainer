[build]
  command = "npm run build"
  publish = "dist"

# Netlify uses this context for deploys of the `beta` branch. The beta build
# clones and builds the unpublished SDK from its cache-render branch. Set
# OSRS_ASSET_BASE_URL in Netlify to select the host for legacy SDK assets.
[context.beta]
  command = "bash scripts/build-beta.sh"
  publish = "dist"

[context.beta.environment]
  OSRS_SDK_REPO = "https://github.com/OldSchoolSDK/osrs-sdk.git"
  OSRS_SDK_BRANCH = "feat/cache-render-bundle"
  OSRS_CACHE_READER_REPO = "https://github.com/Supalosa/osrscachereader.git"
  OSRS_CACHE_READER_BRANCH = "feat/reader-only-entrypoint"
  OSRS_ASSET_BASE_URL = "https://assets-soltrainer.netlify.app"
  OSRS_CACHE_RENDER_MANIFEST_URL = "/cache-render/manifest.json"
